name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- fast checks
  static:
    name: Unit tests & static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            consumer/requirements*.txt
            benchmark/requirements.txt

      - name: Install dependencies
        run: pip install -r consumer/requirements-dev.txt pyyaml

      - name: Consumer unit tests
        working-directory: consumer
        run: python -m pytest -v

      - name: Shell syntax
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f" && echo "ok $f"; done

      - name: JSON / YAML / notebook parse
        run: |
          python - <<'EOF'
          import json, subprocess, yaml
          files = subprocess.check_output(["git", "ls-files"], text=True).split()
          for f in files:
              if f.endswith((".json", ".ipynb")):
                  json.load(open(f, encoding="utf-8"))
              elif f.endswith((".yml", ".yaml")):
                  yaml.safe_load(open(f, encoding="utf-8"))
          print("all JSON/YAML files parse")
          EOF

      - name: docker compose config
        run: docker compose --env-file .env.example --profile monitoring --profile bench config -q

  # ------------------------------------------------- full stack + chaos scenarios
  e2e:
    name: End-to-end & chaos
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: benchmark/requirements.txt

      - name: Install benchmark dependencies
        run: pip install -r benchmark/requirements.txt

      - name: Prepare host
        run: |
          sudo sysctl -w vm.max_map_count=262144
          cp .env.example .env
          free -h; nproc

      - name: Start stack (without Kibana / Kafka UI)
        run: docker compose up -d --build --scale kibana=0 --scale kafka-ui=0

      - name: Wait for init jobs and connectors
        run: |
          for i in $(seq 1 60); do
            s="$(docker compose ps -a --format '{{.Service}}={{.Status}}' | tr '\n' ' ')"
            echo "$s"
            if echo "$s" | grep -qE '(kafka-init|es-init|connect-init)=Exited \([1-9]'; then
              echo "an init job failed"; exit 1
            fi
            echo "$s" | grep -q 'connect-init=Exited (0)' && echo "$s" | grep -q 'es-init=Exited (0)' && break
            sleep 10
          done
          docker compose logs --no-log-prefix kafka-init es-init connect-init
          for c in debezium-products debezium-orders-outbox; do
            curl -fsS "localhost:8083/connectors/$c/status" | tee /dev/stderr | grep -q '"state":"RUNNING"'
          done

      - name: Seed and verify
        run: |
          python benchmark/seed.py --products 2000 --orders 200
          python benchmark/verify_consistency.py --wait 120

      - name: Functional checks (update, Vietnamese search, soft delete, outbox)
        run: |
          P="docker compose exec -T postgres psql -U cdc_app -d cdc -tAc"
          $P "UPDATE products SET name = 'Điện thoại thử nghiệm CDC' WHERE id = 1"
          $P "DELETE FROM products WHERE id = 2"
          $P "BEGIN; UPDATE orders SET status='shipped' WHERE id=3; SELECT emit_order_event(3,'OrderUpdated'); COMMIT;"
          sleep 5
          curl -fsS 'localhost:9200/products/_search?q=name:(dien%20thoai%20thu%20nghiem)&size=1' | grep -q 'Điện thoại thử nghiệm CDC'
          curl -fsS 'localhost:9200/products/_doc/2' | grep -q '"is_deleted":true'
          curl -fsS 'localhost:9200/orders/_doc/3' | grep -q '"status":"shipped"'
          echo "functional checks passed"

      - name: Latency probe
        run: python benchmark/measure_lag.py probe --count 50 --interval 0.1

      - name: "Chaos 01: kill consumer"
        run: bash benchmark/chaos/01-kill-consumer.sh
      - name: "Chaos 02: Elasticsearch outage"
        run: bash benchmark/chaos/02-es-outage.sh
      - name: "Chaos 03: Kafka Connect outage"
        run: bash benchmark/chaos/03-connect-outage-wal.sh
      - name: "Chaos 04: Kafka restart"
        run: bash benchmark/chaos/04-kafka-restart.sh
      - name: "Chaos 05: poison messages"
        run: bash benchmark/chaos/05-poison-message.sh
      - name: "Chaos 06: schema evolution"
        run: bash benchmark/chaos/06-schema-evolution.sh
      - name: "Chaos 07: TOAST (replica identity DEFAULT)"
        run: bash benchmark/chaos/07-toast-update.sh --default
      - name: "Chaos 08: rebuild index by replay"
        run: bash benchmark/chaos/08-rebuild-index.sh 2
      - name: "Chaos 09: lost replication slot"
        run: bash benchmark/chaos/09-slot-lost.sh --yes

      - name: Collect logs
        if: always()
        run: |
          mkdir -p ci-logs
          docker compose ps -a > ci-logs/ps.txt
          for s in postgres kafka kafka-connect elasticsearch consumer kafka-init es-init connect-init; do
            docker compose logs --no-color "$s" > "ci-logs/$s.log" 2>&1 || true
          done
          cp -r results ci-logs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-logs
          path: ci-logs/
          retention-days: 7

  # ------------------------------------------------------------- delivery (CD)
  publish:
    name: Publish consumer image
    needs: [static, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Image name (GHCR requires lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cdc-consumer" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: consumer
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

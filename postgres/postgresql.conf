# Mounted as /etc/postgresql/postgresql.conf and loaded via -c config_file=...
# Only settings that differ from defaults are listed.

listen_addresses = '*'
port = 5432
max_connections = 200

shared_buffers = 512MB
effective_cache_size = 1GB
work_mem = 8MB
maintenance_work_mem = 128MB

# --- Logical decoding (CDC) -------------------------------------------------
wal_level = logical
max_replication_slots = 8          # products slot + orders slot + headroom
max_wal_senders = 8
# Cap on WAL a slot may retain. If Kafka Connect is down long enough to exceed
# this, the slot becomes wal_status = 'lost' instead of filling the disk of the
# primary database. Recovery procedure: docs/runbook.md#slot-lost.
max_slot_wal_keep_size = 2GB
wal_sender_timeout = 60s

# --- WAL / checkpoints ------------------------------------------------------
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_timeout = 5min
checkpoint_completion_target = 0.9

# --- Observability ----------------------------------------------------------
track_commit_timestamp = on        # pg_xact_commit_timestamp() for lag analysis
log_min_duration_statement = 1000
log_replication_commands = on
log_timezone = 'UTC'
timezone = 'UTC'
